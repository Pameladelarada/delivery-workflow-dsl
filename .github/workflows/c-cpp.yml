name: CI

on:
  push:
    branches: [main, version2]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilador:
    name: Compilador DSL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Versión del compilador
        run: g++ --version

      - name: Compilar
        run: make

      - name: El ejemplo válido debe compilar sin errores
        run: |
          ./bin/delivery_compiler examples/pedido_basico.dsl > salida.json
          python3 -c "import json,sys; d=json.load(open('salida.json')); sys.exit(0 if d['success'] else 1)"

      - name: El ejemplo con error semántico debe fallar con código 2
        run: |
          set +e
          ./bin/delivery_compiler examples/error_semantico.dsl > errores.json
          codigo=$?
          set -e
          test "$codigo" -eq 2 || { echo "Se esperaba código 2, se obtuvo $codigo"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('errores.json')); sys.exit(0 if d['errors'] else 1)"

      # Regresión: una llave de cierre suelta colgaba el compilador para
      # siempre y consumía 350 MB de RAM en cinco segundos.
      - name: Regresión — ninguna entrada debe dejar el compilador colgado
        if: runner.os == 'Linux'
        run: |
          # Estas entradas son invalidas a proposito, asi que el compilador
          # devuelve un codigo distinto de cero. Lo que se comprueba aqui no es
          # el codigo, sino que termine: 124 significa que timeout tuvo que
          # matarlo. Sin "|| codigo=$?" el set -e de Actions abortaria el paso
          # en la primera entrada, antes siquiera de mirar el codigo.
          fallos=0

          for entrada in '}' '}}}}}}' '{{{{{{' '}{}{}{' ':::' 'PEDIDO }'; do
            printf '%s\n' "$entrada" > basura.dsl

            codigo=0
            timeout 5 ./bin/delivery_compiler basura.dsl > /dev/null 2>&1 || codigo=$?

            if [ "$codigo" -eq 124 ]; then
              echo "FALLO: la entrada '$entrada' dejo el compilador colgado"
              fallos=$((fallos + 1))
            else
              echo "ok: '$entrada' termino con codigo $codigo"
            fi
          done

          rm -f basura.dsl

          if [ "$fallos" -gt 0 ]; then
            echo "$fallos entradas dejaron el compilador colgado"
            exit 1
          fi

          echo "OK: todas las entradas terminan"

      # Regresión: jsonEscape no escapaba los caracteres de control, así que
      # la salida dejaba de ser JSON y la web no podía leerla.
      - name: Regresión — la salida siempre debe ser JSON válido
        run: |
          printf 'PEDIDO {\n    cliente: "A\001B"\n}\n' > control.dsl
          ./bin/delivery_compiler control.dsl > control.json || true
          python3 -c "import json; json.load(open('control.json')); print('OK: JSON válido')"

  pruebas:
    name: Pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Compilar el compilador DSL
        run: make

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Ejecutar las pruebas
        run: pytest tests/ -v

  docker:
    name: La imagen de Docker construye y arranca
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t delivery-workflow-dsl .

      # El despliegue estuvo roto por dos motivos que este paso detecta:
      # gunicorn faltaba en requirements.txt, y app.py buscaba un binario
      # con extensión .exe dentro de un contenedor Linux.
      - name: El contenedor debe arrancar y responder
        run: |
          docker run -d --name dsl -p 5000:5000 -e PORT=5000 delivery-workflow-dsl
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/ > /dev/null; then
              echo "OK: el contenedor responde"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "FALLO: el contenedor no respondió"
              docker logs dsl
              exit 1
            fi
            sleep 2
          done

      - name: El compilador debe funcionar dentro del contenedor
        run: |
          respuesta=$(curl -sf -X POST http://127.0.0.1:5000/compile \
            -H 'Content-Type: application/json' \
            -d "$(python3 -c "import json;print(json.dumps({'source':open('examples/pedido_basico.dsl').read()}))")")
          echo "$respuesta" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if not d['success']:
              print('FALLO: el compilador no se encontró dentro del contenedor')
              print(d['errors'])
              sys.exit(1)
          print(f'OK: {len(d[\"tokens\"])} tokens analizados dentro del contenedor')
          "

      - name: Registro del contenedor
        if: always()
        run: docker logs dsl || true
