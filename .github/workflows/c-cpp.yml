name: CI

on:
  push:
    branches: [main, version2]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilador:
    name: Compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Compiler version
        run: g++ --version

      - name: Build
        run: make

      - name: The valid example must compile with no errors
        run: |
          ./bin/delivery_compiler examples/pedido_basico.dsl > salida.json
          python3 -c "import json,sys; d=json.load(open('salida.json')); sys.exit(0 if d['success'] else 1)"

      - name: The semantic-error example must fail with exit code 2
        run: |
          set +e
          ./bin/delivery_compiler examples/error_semantico.dsl > errores.json
          codigo=$?
          set -e
          test "$codigo" -eq 2 || { echo "Expected exit code 2, got $codigo"; exit 1; }
          python3 -c "import json,sys; d=json.load(open('errores.json')); sys.exit(0 if d['errors'] else 1)"

      # Regresión: una llave de cierre suelta colgaba el compilador para
      # siempre y consumía 350 MB de RAM en cinco segundos.
      - name: Regression - no input may leave the compiler hanging
        if: runner.os == 'Linux'
        run: |
          # Estas entradas son invalidas a proposito, asi que el compilador
          # devuelve un codigo distinto de cero. Lo que se comprueba aqui no es
          # el codigo, sino que termine: 124 significa que timeout tuvo que
          # matarlo. Sin "|| codigo=$?" el set -e de Actions abortaria el paso
          # en la primera entrada, antes siquiera de mirar el codigo.
          fallos=0

          for entrada in '}' '}}}}}}' '{{{{{{' '}{}{}{' ':::' 'PEDIDO }'; do
            printf '%s\n' "$entrada" > basura.dsl

            codigo=0
            timeout 5 ./bin/delivery_compiler basura.dsl > /dev/null 2>&1 || codigo=$?

            if [ "$codigo" -eq 124 ]; then
              echo "FAILED: input '$entrada' left the compiler hanging"
              fallos=$((fallos + 1))
            else
              echo "ok: '$entrada' exited with code $codigo"
            fi
          done

          rm -f basura.dsl

          if [ "$fallos" -gt 0 ]; then
            echo "$fallos inputs left the compiler hanging"
            exit 1
          fi

          echo "OK: every input terminates"

      # Regresión: jsonEscape no escapaba los caracteres de control, así que
      # la salida dejaba de ser JSON y la web no podía leerla.
      - name: Regression - the output must always be valid JSON
        run: |
          printf 'PEDIDO {\n    cliente: "A\001B"\n}\n' > control.dsl
          ./bin/delivery_compiler control.dsl > control.json || true
          python3 -c "import json; json.load(open('control.json')); print('OK: valid JSON')"

  pruebas:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build the DSL compiler
        run: make

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run the test suite
        run: pytest tests/ -v

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t delivery-workflow-dsl .

      # El despliegue estuvo roto por dos motivos que este paso detecta:
      # gunicorn faltaba en requirements.txt, y app.py buscaba un binario
      # con extensión .exe dentro de un contenedor Linux.
      - name: The container must boot and respond
        run: |
          docker run -d --name dsl -p 5000:5000 -e PORT=5000 delivery-workflow-dsl
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/ > /dev/null; then
              echo "OK: the container responds"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "FAILED: the container did not respond"
              docker logs dsl
              exit 1
            fi
            sleep 2
          done

      - name: The compiler must work inside the container
        run: |
          respuesta=$(curl -sf -X POST http://127.0.0.1:5000/compile \
            -H 'Content-Type: application/json' \
            -d "$(python3 -c "import json;print(json.dumps({'source':open('examples/pedido_basico.dsl').read()}))")")
          echo "$respuesta" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          if not d['success']:
              print('FAILED: the compiler was not found inside the container')
              print(d['errors'])
              sys.exit(1)
          print(f'OK: {len(d[\"tokens\"])} tokens analysed inside the container')
          "

      - name: Container logs
        if: always()
        run: docker logs dsl || true
