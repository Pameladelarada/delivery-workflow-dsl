<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DSL Delivery Workflow Compiler</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app-shell">
        <section class="workspace">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Compiladores + DSL + Workflows</p>
                    <h1>Delivery Workflow DSL</h1>
                </div>
                <button id="runButton" type="button">Ejecutar workflow</button>
            </header>

            <div class="editor-grid">
                <section class="panel editor-panel">
                    <div class="panel-title">
                        <h2>Codigo DSL</h2>
                        <button id="resetButton" type="button" class="secondary">Ejemplo</button>
                    </div>
                    <textarea id="source" spellcheck="false">{{ example }}</textarea>
                </section>

                <section class="panel results-panel">
                    <div class="panel-title">
                        <h2>Resultado</h2>
                        <span id="status" class="status neutral">Listo</span>
                    </div>

                    <div class="summary">
                        <div>
                            <span>Cliente</span>
                            <strong id="client">-</strong>
                        </div>
                        <div>
                            <span>Total</span>
                            <strong id="total">-</strong>
                        </div>
                        <div>
                            <span>Estado</span>
                            <strong id="state">Sin ejecutar</strong>
                        </div>
                    </div>

                    <h3>Logs del workflow</h3>
                    <ul id="logs" class="list"></ul>

                    <h3>Errores</h3>
                    <ul id="errors" class="list errors"></ul>
                </section>
            </div>

            <section class="panel token-panel">
                <div class="panel-title">
                    <h2>Tokens reconocidos</h2>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Tipo</th>
                                <th>Lexema</th>
                                <th>Linea</th>
                                <th>Columna</th>
                            </tr>
                        </thead>
                        <tbody id="tokens"></tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <script>
        window.DEFAULT_EXAMPLE = {{ example|tojson }};
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
